name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  native:
    name: Native build and test gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xvfb

      - name: Install license audit tool
        run: cargo +stable install cargo-about --version 0.9.1 --locked --features cli

      - name: Verify and package
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version=$(sed -n '/^\[workspace\.package\]$/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' Cargo.toml)
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          cargo fetch --locked
          ./scripts/check-licenses.sh
          cargo test --workspace --all-targets --locked --offline
          ./scripts/package-native-release.sh

      - name: Smoke-test quick-run executable
        run: |
          binary=$(find dist -maxdepth 1 -type f -name '*.bin' -print -quit)
          test -n "${binary}"
          test -x "${binary}"
          G_DEBUG=fatal-warnings \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a "${binary}" --check-icons
          GTK_A11Y=none \
            GSK_RENDERER=cairo \
            ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
            xvfb-run -a "${binary}"

  flatpak:
    name: Flatpak x86_64
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: OneNoteViewer-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.emsi.OneNoteViewer.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Verify bundled application and extractor
        run: |
          flatpak install --noninteractive ./OneNoteViewer-linux-x86_64.flatpak
          flatpak run --command=7zz io.github.emsi.OneNoteViewer i |
            grep 'Cab' >/dev/null
          xvfb-run -a \
            flatpak run \
              --env=G_DEBUG=fatal-warnings \
              --env=GTK_A11Y=none \
              --env=GSK_RENDERER=cairo \
              io.github.emsi.OneNoteViewer \
              --check-icons
          xvfb-run -a \
            flatpak run \
              --env=GTK_A11Y=none \
              --env=GSK_RENDERER=cairo \
              --env=ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
              io.github.emsi.OneNoteViewer

      - name: Generate Flatpak checksum
        run: sha256sum OneNoteViewer-linux-x86_64.flatpak > OneNoteViewer-linux-x86_64.flatpak.sha256

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onenote-viewer-flatpak-x86_64
          path: |
            OneNoteViewer-linux-x86_64.flatpak
            OneNoteViewer-linux-x86_64.flatpak.sha256
          if-no-files-found: error

  appimage:
    name: AppImage x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            adwaita-icon-theme \
            libgtk-4-dev \
            librsvg2-common \
            patchelf \
            shared-mime-info \
            xvfb

      - name: Build AppImage
        run: ./scripts/build-appimage-release.sh

      - name: Verify bundled application and extractor
        run: |
          appimage=$(realpath "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)")
          test -n "${appimage}"
          test -x "${appimage}"
          APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --version
          APPIMAGE_EXTRACT_AND_RUN=1 \
            G_DEBUG=fatal-warnings \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a "${appimage}" --check-icons
          APPIMAGE_EXTRACT_AND_RUN=1 \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
            xvfb-run -a "${appimage}" 2>&1 | tee appimage-smoke.log
          if grep -E 'Failed to load icon|Unrecognized image file format' appimage-smoke.log; then
            exit 1
          fi
          mkdir payload-check
          cd payload-check
          "${appimage}" --appimage-extract >/dev/null
          ./squashfs-root/usr/bin/7zz i | grep 'Cab' >/dev/null
          test -s squashfs-root/usr/share/licenses/io.github.emsi.OneNoteViewer/7-ZIP-LICENSE.txt
          test -s squashfs-root/usr/share/sources/io.github.emsi.OneNoteViewer/7z2602-src.tar.xz

      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onenote-viewer-appimage-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - native
      - flatpak
      - appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: onenote-viewer-*
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum ./*.AppImage ./*.flatpak > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            ## Install the Flatpak

            Flatpak is the primary release channel. Download
            `OneNoteViewer-linux-x86_64.flatpak` and its `.sha256` file below,
            then run:

            ```bash
            sha256sum --check OneNoteViewer-linux-x86_64.flatpak.sha256
            flatpak remote-add --user --if-not-exists flathub \
              https://dl.flathub.org/repo/flathub.flatpakrepo
            flatpak install --user --or-update ./OneNoteViewer-linux-x86_64.flatpak
            flatpak run io.github.emsi.OneNoteViewer
            ```

            This is a directly distributed bundle. To update, download the
            newer bundle and repeat the checksum and `flatpak install
            --user --or-update` commands.
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --notes "${RELEASE_NOTES}" \
            --title "OneNote Viewer ${GITHUB_REF_NAME}" \
            dist/*.AppImage \
            dist/*.flatpak \
            dist/*.sha256 \
            dist/SHA256SUMS
