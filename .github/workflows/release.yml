name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  native:
    name: Native build and test gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xvfb

      - name: Install license audit tool
        run: cargo +stable install cargo-about --version 0.9.1 --locked --features cli

      - name: Verify and package
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version=$(sed -n '/^\[workspace\.package\]$/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' Cargo.toml)
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          cargo fetch --locked
          ./scripts/check-licenses.sh
          cargo test --workspace --all-targets --locked --offline
          ./scripts/package-native-release.sh

      - name: Smoke-test quick-run executable
        run: |
          binary=$(find dist -maxdepth 1 -type f -name '*.bin' -print -quit)
          test -n "${binary}"
          test -x "${binary}"
          G_DEBUG=fatal-warnings \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a "${binary}" --check-icons
          GTK_A11Y=none \
            GSK_RENDERER=cairo \
            ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
            xvfb-run -a "${binary}"

  flatpak:
    name: Flatpak x86_64
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]$/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' Cargo.toml)
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "bundle=OneNoteViewer-${version}-linux-x86_64.flatpak" >> "${GITHUB_OUTPUT}"

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: ${{ steps.release.outputs.bundle }}
          branch: stable
          manifest-path: packaging/flatpak/io.github.emsi.OneNoteViewer.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Verify bundled application and extractor
        env:
          BUNDLE: ${{ steps.release.outputs.bundle }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          flatpak install --noninteractive "./${BUNDLE}"
          installed=$(flatpak list --app --columns=application,version,branch |
            awk '$1 == "io.github.emsi.OneNoteViewer" { print $2 "|" $3 }')
          test "${installed}" = "${VERSION}|stable"
          reported_version=$(flatpak run io.github.emsi.OneNoteViewer --version |
            head -n 1)
          test "${reported_version}" = "OneNote Viewer ${VERSION}"
          flatpak run --command=7zz io.github.emsi.OneNoteViewer i |
            grep 'Cab' >/dev/null
          xvfb-run -a \
            flatpak run \
              --env=G_DEBUG=fatal-warnings \
              --env=GTK_A11Y=none \
              --env=GSK_RENDERER=cairo \
              io.github.emsi.OneNoteViewer \
              --check-icons
          xvfb-run -a \
            flatpak run \
              --env=GTK_A11Y=none \
              --env=GSK_RENDERER=cairo \
              --env=ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
              io.github.emsi.OneNoteViewer

      - name: Generate Flatpak checksum
        env:
          BUNDLE: ${{ steps.release.outputs.bundle }}
        run: sha256sum "${BUNDLE}" > "${BUNDLE}.sha256"

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onenote-viewer-flatpak-x86_64
          path: |
            OneNoteViewer-*-linux-x86_64.flatpak
            OneNoteViewer-*-linux-x86_64.flatpak.sha256
          if-no-files-found: error

  appimage:
    name: AppImage x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            adwaita-icon-theme \
            libgtk-4-dev \
            librsvg2-common \
            patchelf \
            shared-mime-info \
            xvfb

      - name: Build AppImage
        run: ./scripts/build-appimage-release.sh

      - name: Verify bundled application and extractor
        run: |
          appimage=$(realpath "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)")
          test -n "${appimage}"
          test -x "${appimage}"
          APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --version
          APPIMAGE_EXTRACT_AND_RUN=1 \
            G_DEBUG=fatal-warnings \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a "${appimage}" --check-icons
          APPIMAGE_EXTRACT_AND_RUN=1 \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
            xvfb-run -a "${appimage}" 2>&1 | tee appimage-smoke.log
          if grep -E 'Failed to load icon|Unrecognized image file format' appimage-smoke.log; then
            exit 1
          fi
          mkdir payload-check
          cd payload-check
          "${appimage}" --appimage-extract >/dev/null
          ./squashfs-root/usr/bin/7zz i | grep 'Cab' >/dev/null
          test -s squashfs-root/usr/share/licenses/io.github.emsi.OneNoteViewer/7-ZIP-LICENSE.txt
          test -s squashfs-root/usr/share/sources/io.github.emsi.OneNoteViewer/7z2602-src.tar.xz

      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onenote-viewer-appimage-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - native
      - flatpak
      - appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: onenote-viewer-*
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum ./*.AppImage ./*.flatpak > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="OneNoteViewer-${version}-linux-x86_64.flatpak"
          read -r -d '' release_notes <<EOF || true
          ## Install the Flatpak

          Flatpak is the primary release channel. Download \`${bundle}\` and
          \`${bundle}.sha256\` below.

          If upgrading from v0.1.0, remove its legacy \`master\` branch once:

          \`\`\`bash
          flatpak uninstall --user io.github.emsi.OneNoteViewer//master
          \`\`\`

          Then verify, install, and run:

          \`\`\`bash
          sha256sum --check ${bundle}.sha256
          flatpak install --user --or-update ./${bundle}
          flatpak run io.github.emsi.OneNoteViewer
          \`\`\`

          This is a directly distributed bundle. To update, download the
          newer bundle and repeat the checksum and install commands.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --notes "${release_notes}" \
            --title "OneNote Viewer ${GITHUB_REF_NAME}" \
            dist/*.AppImage \
            dist/*.flatpak \
            dist/*.sha256 \
            dist/SHA256SUMS
