name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            label: aarch64 (experimental)
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xdotool xvfb

      - name: Install license audit tool
        run: cargo +stable install cargo-about --version 0.9.1 --locked --features cli

      - name: Verify and package
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version=$(sed -n '/^\[workspace\.package\]$/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' Cargo.toml)
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
          cargo fetch --locked
          ./scripts/check-licenses.sh
          cargo test --workspace --all-targets --locked --offline
          GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a cargo test -p onenote-render-gtk \
              scroll_adjustments_invalidate_the_viewport_snapshot --locked --offline
          GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a cargo test -p onenote-render-gtk \
              attachment_ --locked --offline
          GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a cargo test -p onenote-viewer --locked --offline
          ./scripts/package-native-release.sh

      - name: Smoke-test quick-run executable
        run: |
          binary=$(find dist -maxdepth 1 -type f -name '*.bin' -print -quit)
          test -n "${binary}"
          test -x "${binary}"
          version=$(sed -n '/^\[workspace\.package\]$/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' Cargo.toml)
          reported_source=$("${binary}" --source | head -n 1)
          test "${reported_source}" = \
            "OneNote Viewer ${version} source revision: ${GITHUB_SHA}"
          G_DEBUG=fatal-warnings \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a "${binary}" --check-icons
          GTK_A11Y=none \
            GSK_RENDERER=cairo \
            ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
            xvfb-run -a "${binary}"

  flatpak:
    name: Flatpak ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            label: aarch64 (experimental)
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace\.package\]$/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' Cargo.toml)
          test -n "${version}"
          mkdir -p target/flatpak
          ONENOTE_VIEWER_SOURCE_REVISION="${GITHUB_SHA}" \
            ./scripts/source-revision.sh > target/flatpak/source-revision
          revision=$(cat target/flatpak/source-revision)
          {
            echo "version=${version}"
            echo "bundle=OneNoteViewer-${version}-linux-${{ matrix.arch }}.flatpak"
            echo "revision=${revision}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          arch: ${{ matrix.arch }}
          bundle: ${{ steps.release.outputs.bundle }}
          branch: stable
          manifest-path: packaging/flatpak/io.github.emsi.OneNoteViewer.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Verify bundled application and extractor
        env:
          BUNDLE: ${{ steps.release.outputs.bundle }}
          REVISION: ${{ steps.release.outputs.revision }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          flatpak install --noninteractive "./${BUNDLE}"
          test "$(flatpak info --show-arch io.github.emsi.OneNoteViewer)" = "${{ matrix.arch }}"
          installed=$(flatpak list --app --columns=application,version,branch |
            awk '$1 == "io.github.emsi.OneNoteViewer" { print $2 "|" $3 }')
          test "${installed}" = "${VERSION}|stable"
          reported_version=$(flatpak run io.github.emsi.OneNoteViewer --version |
            head -n 1)
          test "${reported_version}" = "OneNote Viewer ${VERSION}"
          reported_source=$(flatpak run io.github.emsi.OneNoteViewer --source |
            head -n 1)
          test "${reported_source}" = \
            "OneNote Viewer ${VERSION} source revision: ${REVISION}"
          flatpak run --command=7zz io.github.emsi.OneNoteViewer i |
            grep 'Cab' >/dev/null
          xvfb-run -a \
            flatpak run \
              --env=G_DEBUG=fatal-warnings \
              --env=GTK_A11Y=none \
              --env=GSK_RENDERER=cairo \
              io.github.emsi.OneNoteViewer \
              --check-icons
          xvfb-run -a \
            flatpak run \
              --env=GTK_A11Y=none \
              --env=GSK_RENDERER=cairo \
              --env=ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
              io.github.emsi.OneNoteViewer

      - name: Generate Flatpak checksum
        env:
          BUNDLE: ${{ steps.release.outputs.bundle }}
        run: sha256sum "${BUNDLE}" > "${BUNDLE}.sha256"

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onenote-viewer-flatpak-${{ matrix.arch }}
          path: |
            OneNoteViewer-*-linux-${{ matrix.arch }}.flatpak
            OneNoteViewer-*-linux-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error

  appimage:
    name: AppImage ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            label: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            label: aarch64 (experimental)
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            adwaita-icon-theme \
            libgtk-4-dev \
            librsvg2-common \
            patchelf \
            shared-mime-info \
            xvfb

      - name: Build AppImage
        run: ./scripts/build-appimage-release.sh

      - name: Verify bundled application and extractor
        run: |
          appimage=$(realpath "$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)")
          test -n "${appimage}"
          test -x "${appimage}"
          APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --version
          reported_source=$(APPIMAGE_EXTRACT_AND_RUN=1 "${appimage}" --source |
            head -n 1)
          version=$(sed -n '/^\[workspace\.package\]$/,/^\[/ { s/^version = "\([^"]*\)"/\1/p; }' Cargo.toml)
          test "${reported_source}" = \
            "OneNote Viewer ${version} source revision: ${GITHUB_SHA}"
          APPIMAGE_EXTRACT_AND_RUN=1 \
            G_DEBUG=fatal-warnings \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            xvfb-run -a "${appimage}" --check-icons
          APPIMAGE_EXTRACT_AND_RUN=1 \
            GTK_A11Y=none \
            GSK_RENDERER=cairo \
            ONENOTE_VIEWER_SMOKE_QUIT_MS=5000 \
            xvfb-run -a "${appimage}" 2>&1 | tee appimage-smoke.log
          if grep -E 'Failed to load icon|Unrecognized image file format' appimage-smoke.log; then
            exit 1
          fi
          mkdir payload-check
          cd payload-check
          "${appimage}" --appimage-extract >/dev/null
          ./squashfs-root/usr/bin/7zz i | grep 'Cab' >/dev/null
          test -s squashfs-root/usr/share/licenses/io.github.emsi.OneNoteViewer/7-ZIP-LICENSE.txt
          test -s squashfs-root/usr/share/sources/io.github.emsi.OneNoteViewer/7z2602-src.tar.xz

      - name: Upload AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onenote-viewer-appimage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - native
      - flatpak
      - appimage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: onenote-viewer-*
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          version="${RELEASE_VERSION#v}"
          for arch in x86_64 aarch64; do
            test -s "OneNoteViewer-${version}-${arch}.AppImage"
            test -s "OneNoteViewer-${version}-linux-${arch}.flatpak"
            sha256sum --check "OneNoteViewer-${version}-${arch}.AppImage.sha256"
            sha256sum --check "OneNoteViewer-${version}-linux-${arch}.flatpak.sha256"
          done
          sha256sum ./*.AppImage ./*.flatpak > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="OneNoteViewer-${version}-linux-\${arch}.flatpak"
          read -r -d '' release_notes <<EOF || true
          ## Architectures

          Flatpak and AppImage are available for x86-64 and ARM64 (aarch64).
          **ARM64 support is experimental/beta.** Automated native ARM64 tests
          and package startup checks pass, but ARM desktop hardware, graphics,
          notebook fidelity, and cross-distribution coverage remain limited.

          | Architecture | Flatpak | AppImage | Support |
          | --- | --- | --- | --- |
          | x86-64 | OneNoteViewer-${version}-linux-x86_64.flatpak | OneNoteViewer-${version}-x86_64.AppImage | Existing support |
          | ARM64 | OneNoteViewer-${version}-linux-aarch64.flatpak | OneNoteViewer-${version}-aarch64.AppImage | Experimental/beta |

          ## Install the Flatpak

          Flatpak is the primary release channel. Download the bundle for your
          architecture and its matching \`.sha256\` file below.

          If upgrading from v0.1.0, remove its legacy \`master\` branch once:

          \`\`\`bash
          flatpak uninstall --user io.github.emsi.OneNoteViewer//master
          \`\`\`

          Then verify, install, and run:

          \`\`\`bash
          arch=\$(flatpak --default-arch)
          sha256sum --check ${bundle}.sha256
          flatpak install --user --or-update ./${bundle}
          flatpak run io.github.emsi.OneNoteViewer
          \`\`\`

          This is a directly distributed bundle. To update, download the
          newer bundle and repeat the checksum and install commands.

          ## Run the AppImage

          Download the AppImage matching \`uname -m\` (\`x86_64\` or \`aarch64\`),
          verify its matching checksum, make it executable, and run it.
          AppImages are built on Ubuntu 24.04 and require compatible system
          libraries. Prefer Flatpak on older or substantially different distributions.
          EOF
          printf '%s\n' "${release_notes}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --notes-file release-notes.md \
            --title "OneNote Viewer ${GITHUB_REF_NAME}" \
            dist/*.AppImage \
            dist/*.flatpak \
            dist/*.sha256 \
            dist/SHA256SUMS
